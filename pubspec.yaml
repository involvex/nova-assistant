name: nova_assistant
description: "Nova — an on-device AI assistant powered by Gemma, with assistant button integration and screen awareness."
publish_to: 'none'
version: 0.4.6+5

environment:
  sdk: '>=3.13.0-282.1.beta <4.0.0'
  flutter: '>=3.47.0-0.1.pre'

dependencies:
  flutter:
    sdk: flutter

  # AI Inference — core + engines
  flutter_gemma: ^1.5.9
  flutter_gemma_litertlm: ^1.4.2
  flutter_gemma_mediapipe: ^1.0.4

  # Permissions
  permission_handler: ^13.0.0

  # Audio (voice input)
  record: ^7.1.1
  just_audio: ^0.10.6
  speech_to_text: ^7.0.0

  # Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.1

  # Network
  http: ^1.3.0

  # UUID for session IDs
  uuid: ^4.5.1

  # Path utilities
  path: ^1.9.0
  crypto: ^3.0.6

  # Screen wakelock
  wakelock_plus: ^1.2.0

  # UI
  flutter_markdown: ^0.7.6
  cupertino_icons: ^1.0.8
  file_picker: 12.0.0-beta.7
  image_picker: ^1.1.2
  package_info_plus: ^10.2.1

  # Notifications
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # Home Screen Widgets
  home_widget: ^0.9.3
  syncfusion_flutter_pdf: ^34.2.2
  flutter_gemma_speech: ^0.4.3
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  dart_code_linter: ^4.1.6
  coverage: ^1.7.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

