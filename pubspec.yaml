name: nova_assistant
description: "Nova — an on-device AI assistant powered by Gemma, with assistant button integration and screen awareness."
publish_to: 'none'
version: 0.4.4+3

environment:
  sdk: '3.13.0-282.1.beta'
  flutter: '3.47.0-0.1.pre'

dependencies:
  flutter:
    sdk: flutter

  # AI Inference — core + engines
  flutter_gemma: ^1.3.1
  flutter_gemma_litertlm: ^1.0.2
  flutter_gemma_mediapipe: ^1.0.3

  # Permissions
  permission_handler: ^12.0.3

  # Audio (voice input)
  record: ^6.0.0
  just_audio: ^0.9.0
  speech_to_text: ^7.0.0

  # Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1

  # Network
  http: ^1.3.0

  # UUID for session IDs
  uuid: ^4.5.1

  # Path utilities
  path: ^1.9.0
  crypto: ^3.0.6

  # UI
  flutter_markdown: ^0.7.6
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  package_info_plus: ^9.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # Home Screen Widgets
  home_widget: ^0.9.3
  syncfusion_flutter_pdf: ^33.2.13
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  dart_code_linter: ^4.1.6
  coverage: ^1.7.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

